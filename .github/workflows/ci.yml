name: CI - Army CT

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: army_ct
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: senha-ficticia-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: chave-ficticia-exclusiva-do-ambiente-descartavel-de-testes
      DB_NAME: army_ct
      DB_USER: postgres
      DB_PASSWORD: senha-ficticia-ci
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Verificar configuração
        run: python manage.py check

      - name: Verificar migrações pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Aplicar migrações
        run: python manage.py migrate --noinput

      - name: Compilar arquivos Python
        run: python -m compileall -q config inscricoes

      - name: Executar testes
        run: python manage.py test inscricoes --verbosity 2